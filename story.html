<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人文故事 · 路上苏州</title>
<meta name="color-scheme" content="dark">
<style>
:root {
  --font-serif: "Songti SC", "STSong", "SimSun", "Noto Serif SC", "Source Han Serif SC", serif;
  --font-sans: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
}
html, body { margin: 0; padding: 0; height: 100%; background: #14171B; }
button { font-family: inherit; cursor: pointer; }
* { box-sizing: border-box; }
 *  人文故事 · 全屏页
 *  深色版本：宣纸转暗，朱印转亮
 * =========================================================== */
#story {
  position: fixed;
  inset: 0;
  z-index: 1;
  overflow: hidden;
  background: #14171B;
  color: #EDE7DA;
  --s-ink: #EDE7DA;
  --s-dim: #A69F92;
  --s-dim2: #7E776B;
  --s-seal: #D9604F;
  --s-teal: #63A3A6;
  --s-gold: #C89A4A;
  --s-line: rgba(237, 231, 218, .14);
  font-family: var(--font-sans);
  opacity: 0;
  animation: stBoot .55s ease forwards;
}
@keyframes stBoot { to { opacity: 1; } }
#story[hidden] { display: none; }
#story[hidden] { display: none; }
#story.on { opacity: 1; pointer-events: auto; }

/* ---------- 背景：随滚动变迁的时代场景 ---------- */
.st-bg { position: absolute; inset: 0; overflow: hidden; }

.st-sky {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, #23201B 0%, #2B2621 46%, #1B1815 100%);
}
.st-sky-mod {
  position: absolute; inset: 0;
  opacity: 0;
  background:
    radial-gradient(120% 78% at 50% 104%, rgba(63, 132, 160, .34) 0%, rgba(63, 132, 160, 0) 62%),
    linear-gradient(180deg, #0A1524 0%, #10253C 48%, #0B1A2A 100%);
}
.st-glow {
  position: absolute; inset: 0;
  opacity: 0;
  background:
    radial-gradient(58% 40% at 22% 88%, rgba(217, 96, 79, .28), transparent 70%),
    radial-gradient(52% 36% at 78% 92%, rgba(96, 176, 190, .26), transparent 70%);
}

.st-scene {
  position: absolute; inset: 0;
  opacity: 0;
  will-change: opacity, transform;
}
.st-scene svg { width: 100%; height: 100%; display: block; }
.st-scene .far  { transform: translateY(calc(var(--off, 0) * .18px)); }
.st-scene .mid  { transform: translateY(calc(var(--off, 0) * .48px)); }
.st-scene .near { transform: translateY(calc(var(--off, 0) * 1px)); }

/* 五个时代的剪影色：由旧暖褐 → 新冷蓝 */
.st-scene[data-era="1"] { color: #31291F; }
.st-scene[data-era="2"] { color: #372C22; }
.st-scene[data-era="3"] { color: #2A2C2F; }
.st-scene[data-era="4"] { color: #1E2631; }
.st-scene[data-era="5"] { color: #111D2E; }
.st-scene .lit { fill: #E9B469; }
.st-scene[data-era="3"] .lit { fill: #D9A05C; }
.st-scene[data-era="4"] .lit { fill: #F2C978; }
.st-scene[data-era="5"] .lit { fill: #7FD8E6; }
.st-scene[data-era="5"] .lit.warm { fill: #F0A08C; }
.st-scene .wire { fill: none; stroke: currentColor; stroke-width: 2; opacity: .7; }
.st-scene[data-era="5"] .wire { stroke: #2C4E68; }

.st-grain {
  position: absolute; inset: -20%;
  opacity: .16;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 3px);
  mix-blend-mode: overlay;
  animation: grainShift 7s steps(9) infinite;
}
@keyframes grainShift {
  0%   { transform: translate(0, 0); }
  100% { transform: translate(-2%, 3%); }
}
.st-vignette {
  position: absolute; inset: 0;
  background:
    radial-gradient(120% 92% at 50% 42%, transparent 42%, rgba(8, 9, 11, .62) 100%),
    linear-gradient(180deg, rgba(10, 11, 13, .58) 0%, transparent 22%, transparent 62%, rgba(10, 11, 13, .72) 100%);
}

/* 场景内的动效 */
.st-scene .tw { animation: tw 2.6s ease-in-out infinite alternate; }
.st-scene .tw2 { animation: tw 3.4s .6s ease-in-out infinite alternate; }
.st-scene .tw3 { animation: tw 4.2s 1.3s ease-in-out infinite alternate; }
@keyframes tw { from { opacity: .18; } to { opacity: .95; } }

.st-scene .boat { animation: boatMove 26s linear infinite; }
@keyframes boatMove { from { transform: translateX(-90px); } to { transform: translateX(1180px); } }

.st-scene .train { animation: trainMove 13s linear infinite; }
@keyframes trainMove { from { transform: translateX(-460px); } to { transform: translateX(1640px); } }

.st-scene .car { animation: carMove 9s linear infinite; }
.st-scene .car.b { animation-duration: 12s; animation-delay: -4s; }
@keyframes carMove { from { transform: translateX(-160px); } to { transform: translateX(1560px); } }

.st-scene .smoke { animation: smokeUp 6s ease-out infinite; }
@keyframes smokeUp {
  0%   { opacity: 0; transform: translateY(0) scale(.6); }
  28%  { opacity: .38; }
  100% { opacity: 0; transform: translateY(-96px) scale(1.5); }
}
.st-scene .beam { stroke-dasharray: 90 220; animation: beamRun 4.5s linear infinite; }
.st-scene .beam.b { animation-delay: -1.7s; }
.st-scene .beam.c { animation-delay: -3.1s; }
@keyframes beamRun { to { stroke-dashoffset: -620; } }

.st-scene .ripple { animation: ripple 5.5s ease-in-out infinite; }
@keyframes ripple {
  0%, 100% { opacity: .12; }
  50%      { opacity: .4; }
}
.st-scene .sway { transform-origin: bottom center; animation: sway 6.5s ease-in-out infinite alternate; }
@keyframes sway { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }

.st-scene .crane { transform-origin: bottom center; animation: crane 9s ease-in-out infinite alternate; }
@keyframes crane { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }

/* ---------- 顶栏 ---------- */
.st-top {
  position: absolute; top: 0; left: 0; right: 0; height: 66px;
  z-index: 6;
  display: flex; align-items: center; gap: 16px;
  padding: 0 26px;
  background: linear-gradient(180deg, rgba(12, 14, 17, .82), rgba(12, 14, 17, 0));
}
.st-back {
  display: inline-flex; align-items: center; gap: 8px;
  height: 36px; padding: 0 16px 0 12px;
  border: 1px solid rgba(237, 231, 218, .26);
  border-radius: 999px;
  background: rgba(20, 23, 27, .55);
  color: var(--s-ink);
  font-size: 13px; letter-spacing: .06em;
  backdrop-filter: blur(8px);
  transition: background .2s, border-color .2s, transform .2s;
}
.st-back:hover { background: var(--s-seal); border-color: var(--s-seal); color: #fff; transform: translateX(-2px); }
.st-back .arw { font-size: 15px; line-height: 1; }

.st-crumb { font-size: 12px; color: var(--s-dim2); letter-spacing: .1em; }
.st-crumb b { color: var(--s-ink); font-weight: 500; font-family: var(--font-serif); letter-spacing: .04em; }
.st-top .sp { flex: 1; }
.st-esc { font-size: 11px; color: var(--s-dim2); letter-spacing: .08em; }
.st-esc kbd {
  font-family: inherit; font-size: 10px; padding: 1px 6px; margin: 0 2px;
  border: 1px solid rgba(237, 231, 218, .22); border-radius: 5px; color: var(--s-dim);
}

/* ---------- 左侧时间条 ---------- */
.st-rail {
  position: absolute; left: 42px; top: 96px; bottom: 54px;
  width: 208px; z-index: 5;
  display: flex; flex-direction: column;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 26px, #000 calc(100% - 26px), transparent 100%);
          mask-image: linear-gradient(180deg, transparent 0, #000 26px, #000 calc(100% - 26px), transparent 100%);
}
.st-rail::before {
  content: ''; position: absolute; left: 7px; top: 0; bottom: 0; width: 1px;
  background: linear-gradient(180deg, transparent, rgba(237, 231, 218, .2) 8%, rgba(237, 231, 218, .2) 92%, transparent);
}
.st-rail-track {
  position: absolute; left: 7px; top: 0; width: 1px; height: 0;
  background: linear-gradient(180deg, var(--s-seal), var(--s-gold));
  box-shadow: 0 0 10px rgba(217, 96, 79, .55);
}

.st-node {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  padding: 7px 0 7px 24px;
  border: 0; background: none; text-align: left;
  color: var(--s-dim2);
  cursor: pointer;
  transition: color .25s, opacity .25s;
  opacity: .58;
}
.st-node .nd {
  position: absolute; left: 2px; top: 50%; margin-top: -4px;
  width: 11px; height: 11px; border-radius: 50%;
  border: 1px solid rgba(237, 231, 218, .4);
  background: #14171B;
  transition: all .25s;
}
.st-node .ny {
  font-family: var(--font-serif);
  font-size: 15px; letter-spacing: .04em; color: var(--s-dim);
  min-width: 46px; font-variant-numeric: tabular-nums;
}
.st-node .nt {
  font-size: 11px; letter-spacing: .03em; line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.st-node { align-items: flex-start; }
.st-node .ny { padding-top: 1px; }
.st-node .nd { top: 14px; margin-top: 0; }
.st-node:hover { opacity: .92; color: var(--s-ink); }

.st-node.on { opacity: 1; color: var(--s-ink); }
.st-node.on .nd {
  background: var(--s-seal); border-color: var(--s-seal);
  box-shadow: 0 0 0 4px rgba(217, 96, 79, .16), 0 0 12px rgba(217, 96, 79, .5);
}
.st-node.on .ny { color: var(--s-seal); }

.st-node[data-kind="rail"].on .nd { background: var(--s-seal); border-color: var(--s-seal); }
.st-node[data-kind="road"].on .nd { background: var(--s-gold); border-color: var(--s-gold); box-shadow: 0 0 0 4px rgba(200,154,74,.16), 0 0 12px rgba(200,154,74,.5); }
.st-node[data-kind="road"].on .ny { color: var(--s-gold); }
.st-node[data-kind="life"].on .nd { background: var(--s-teal); border-color: var(--s-teal); box-shadow: 0 0 0 4px rgba(99,163,166,.16), 0 0 12px rgba(99,163,166,.5); }
.st-node[data-kind="life"].on .ny { color: var(--s-teal); }

.st-node .nk {
  font-size: 9px; letter-spacing: .12em; padding: 1px 5px; border-radius: 4px;
  border: 1px solid currentColor; opacity: .55;
}

/* ---------- 滚动内容 ---------- */
.st-scroll {
  position: absolute; inset: 0;
  overflow-y: auto; overflow-x: hidden;
  z-index: 4;
  scroll-behavior: smooth;
  overscroll-behavior: contain;
}
.st-scroll::-webkit-scrollbar { width: 8px; }
.st-scroll::-webkit-scrollbar-track { background: transparent; }
.st-scroll::-webkit-scrollbar-thumb { background: rgba(237, 231, 218, .18); border-radius: 4px; }
.st-scroll::-webkit-scrollbar-thumb:hover { background: rgba(237, 231, 218, .3); }

.st-doc {
  position: relative;
  padding: 84px 40px 200px;
  max-width: 900px;
  margin-left: max(276px, calc((100% - 900px) / 2));
  margin-right: auto;
}

/* 扉页 */
.st-hero { padding: 42px 0 64px; }
.st-hero .st-kicker {
  font-size: 11px; letter-spacing: .46em; color: var(--s-dim2);
  text-indent: .46em; margin-bottom: 18px;
}
.st-hero h2 {
  font-family: var(--font-serif);
  font-size: clamp(38px, 5.4vw, 62px);
  line-height: 1.12; font-weight: 600; letter-spacing: .04em;
  margin: 0 0 6px; color: #FFFDF8;
  text-shadow: 0 2px 30px rgba(0, 0, 0, .5);
}
.st-hero .st-cat {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 12px; letter-spacing: .16em; color: var(--s-dim);
  margin-bottom: 22px;
}
.st-hero .st-cat i {
  width: 16px; height: 1px; background: var(--s-seal); display: inline-block;
}
.st-hero .st-lead {
  font-family: var(--font-serif);
  font-size: 18px; line-height: 2; color: #EFE9DC;
  max-width: 620px; margin: 0 0 20px;
  text-shadow: 0 1px 20px rgba(0, 0, 0, .45);
}
.st-hero .st-quote {
  font-family: var(--font-serif);
  font-size: 15px; line-height: 1.9; color: var(--s-gold);
  letter-spacing: .08em;
  padding-left: 16px; border-left: 2px solid rgba(200, 154, 74, .5);
  margin: 0 0 30px;
}
.st-hero .st-meta {
  display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px;
}
.st-chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; letter-spacing: .06em; color: var(--s-dim);
  padding: 5px 12px; border-radius: 999px;
  border: 1px solid var(--s-line); background: rgba(20, 23, 27, .5);
  backdrop-filter: blur(6px);
}
.st-chip b { color: var(--s-ink); font-weight: 500; }
.st-chip.seal { border-color: rgba(217, 96, 79, .4); color: #EFA294; }
.st-chip.seal b { color: #FFC9BC; }

.st-scrollhint {
  display: flex; align-items: center; gap: 10px;
  margin-top: 46px; font-size: 11.5px; letter-spacing: .14em; color: var(--s-dim2);
}
.st-scrollhint .ln {
  width: 46px; height: 1px; background: linear-gradient(90deg, var(--s-dim2), transparent);
  position: relative; overflow: hidden;
}
.st-scrollhint .ln::after {
  content: ''; position: absolute; inset: 0; width: 12px;
  background: var(--s-seal); animation: hintRun 2.2s ease-in-out infinite;
}
@keyframes hintRun { 0% { left: -14px; } 100% { left: 48px; } }

/* 章节 */
.st-ch {
  position: relative;
  margin: 0 0 46px;
  padding: 22px 26px 24px 26px;
  border: 1px solid var(--s-line);
  border-left: 3px solid var(--s-dim2);
  border-radius: 4px 14px 14px 4px;
  background: linear-gradient(180deg, rgba(24, 28, 33, .74), rgba(18, 21, 25, .68));
  backdrop-filter: blur(14px);
  box-shadow: 0 18px 46px rgba(0, 0, 0, .34);
  opacity: 0;
  transform: translateY(30px);
  transition: opacity .72s cubic-bezier(.22, .61, .36, 1), transform .72s cubic-bezier(.22, .61, .36, 1);
}
.st-ch.in { opacity: 1; transform: none; }

.st-ch .ch-top { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.st-ch .ch-y {
  font-family: var(--font-serif); font-size: 30px; line-height: 1;
  letter-spacing: .02em; font-variant-numeric: tabular-nums; color: #FFFDF8;
}
.st-ch .ch-y small { font-size: 12px; color: var(--s-dim2); margin-left: 2px; }
.st-ch .ch-t {
  font-family: var(--font-serif); font-size: 19px; font-weight: 600;
  letter-spacing: .05em; margin: 0; color: #FFFDF8; flex: 1;
}
.st-ch .ch-tag {
  font-size: 10px; letter-spacing: .16em; padding: 3px 9px; border-radius: 4px;
  border: 1px solid currentColor; white-space: nowrap;
}
.st-ch .ch-x {
  margin: 0; font-size: 14.5px; line-height: 2.02; color: #DAD3C6;
  letter-spacing: .015em;
}

.st-ch[data-kind="spot"] { border-left-color: #8C8579; }
.st-ch[data-kind="spot"] .ch-tag { color: #B9B1A2; }
.st-ch[data-kind="life"] { border-left-color: var(--s-teal); }
.st-ch[data-kind="life"] .ch-tag { color: var(--s-teal); }
.st-ch[data-kind="rail"] { border-left-color: var(--s-seal); }
.st-ch[data-kind="rail"] .ch-tag { color: #E8897A; }
.st-ch[data-kind="road"] { border-left-color: var(--s-gold); }
.st-ch[data-kind="road"] .ch-tag { color: #DDAD63; }

/* 交通章节：加一层暖光强调 */
.st-ch[data-kind="rail"], .st-ch[data-kind="road"] {
  background:
    linear-gradient(90deg, rgba(217, 96, 79, .1), rgba(217, 96, 79, 0) 46%),
    linear-gradient(180deg, rgba(24, 28, 33, .78), rgba(18, 21, 25, .7));
}
.st-ch[data-kind="road"] {
  background:
    linear-gradient(90deg, rgba(200, 154, 74, .1), rgba(200, 154, 74, 0) 46%),
    linear-gradient(180deg, rgba(24, 28, 33, .78), rgba(18, 21, 25, .7));
}

/* 配图 */
.st-fig {
  margin: 18px 0 0; border-radius: 10px; overflow: hidden;
  border: 1px solid var(--s-line);
  background: #101317;
  position: relative;
}
.st-fig img {
  display: block; width: 100%; height: auto;
  filter: saturate(.92) contrast(1.04) brightness(.94);
  transition: transform 1.1s cubic-bezier(.22, .61, .36, 1), filter .6s;
}
.st-fig:hover img { transform: scale(1.035); filter: saturate(1) contrast(1.06) brightness(1); }
.st-fig figcaption {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 22px 14px 10px;
  font-size: 11.5px; letter-spacing: .1em; color: #DAD3C6;
  background: linear-gradient(180deg, transparent, rgba(8, 9, 11, .86));
}
.st-fig .noimg {
  display: flex; align-items: center; justify-content: center;
  height: 190px; color: var(--s-dim2); font-size: 12px; letter-spacing: .16em;
  background:
    repeating-linear-gradient(135deg, rgba(237,231,218,.035) 0 10px, transparent 10px 20px),
    #14181D;
}

/* 双图并排 */
.st-figs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
.st-figs .st-fig { margin: 0; }

/* 人文关联 · 结尾大卡 */
.st-bond {
  position: relative;
  margin: 68px 0 0;
  padding: 30px 32px 32px;
  border: 1px solid rgba(217, 96, 79, .34);
  border-radius: 16px;
  background:
    radial-gradient(120% 100% at 0% 0%, rgba(217, 96, 79, .16), transparent 58%),
    linear-gradient(180deg, rgba(26, 20, 20, .84), rgba(17, 18, 21, .8));
  backdrop-filter: blur(14px);
  box-shadow: 0 22px 60px rgba(0, 0, 0, .4);
}
.st-bond .bd-kicker {
  font-size: 10.5px; letter-spacing: .34em; color: #E8897A; margin-bottom: 14px;
}
.st-bond h3 {
  font-family: var(--font-serif); font-size: 25px; font-weight: 600;
  letter-spacing: .05em; margin: 0 0 16px; color: #FFFDF8;
}
.st-bond .bd-x {
  font-size: 14.5px; line-height: 2.02; color: #E3DCD0; margin: 0 0 22px;
}
.st-bond .bd-grid {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;
}
.st-bond .bd-cell {
  padding: 13px 14px; border-radius: 10px;
  border: 1px solid var(--s-line); background: rgba(10, 12, 15, .42);
}
.st-bond .bd-cell span {
  display: block; font-size: 10px; letter-spacing: .2em; color: var(--s-dim2); margin-bottom: 6px;
}
.st-bond .bd-cell b {
  font-size: 15px; font-weight: 500; color: #FFFDF8; font-family: var(--font-serif); letter-spacing: .03em;
}
.st-bond .bd-cell em { display: block; font-style: normal; font-size: 11px; color: var(--s-dim); margin-top: 4px; }

.st-bond .bd-foot {
  margin-top: 22px; padding-top: 18px; border-top: 1px solid rgba(237, 231, 218, .12);
  display: flex; gap: 12px; flex-wrap: wrap;
}
.st-bond .bd-btn {
  height: 38px; padding: 0 18px; border-radius: 999px;
  border: 1px solid rgba(217, 96, 79, .45);
  background: rgba(217, 96, 79, .14); color: #FFC9BC;
  font-size: 13px; letter-spacing: .06em;
  transition: background .2s, color .2s;
}
.st-bond .bd-btn:hover { background: var(--s-seal); color: #fff; }
.st-bond .bd-btn.ghost { border-color: var(--s-line); background: rgba(237,231,218,.05); color: var(--s-dim); }
.st-bond .bd-btn.ghost:hover { background: rgba(237,231,218,.12); color: var(--s-ink); }

/* 尾注 */
.st-end {
  margin-top: 74px; text-align: center;
  font-size: 11.5px; letter-spacing: .2em; color: var(--s-dim2);
}
.st-end .dot { color: var(--s-seal); margin: 0 8px; }

/* 故事页小屏 */
@media (max-width: 1080px) {
  .st-rail { width: 168px; left: 22px; }
  .st-doc { margin-left: 210px; padding: 76px 26px 180px; }
}
@media (max-width: 780px) {
  .st-rail { display: none; }
  .st-doc { margin: 0 auto; padding: 76px 20px 160px; }
  .st-figs { grid-template-columns: 1fr; }
  .st-bond .bd-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<section id="story">
  <div class="st-bg" id="stBg">
    <div class="st-sky"></div>
    <div class="st-sky-mod" id="stSkyMod"></div>
    <div class="st-glow" id="stGlow"></div>
    <div class="st-grain"></div>
    <div class="st-vignette"></div>
  </div>

  <div class="st-top">
    <button class="st-back" id="stBack" title="返回线路图"><span class="arw">←</span>返回线路图</button>
    <div class="st-crumb">人文故事<span style="opacity:.4;margin:0 8px">/</span><b id="stCrumb">—</b></div>
    <div class="sp"></div>
    <div class="st-esc">鼠标右键 或 <kbd>Esc</kbd> 亦可返回</div>
  </div>

  <nav class="st-rail" id="stRail" aria-label="时间条">
    <div class="st-rail-track" id="stRailTrack"></div>

  function stNameOf(s) {
    if (s == null) return '';
    if (typeof s === 'string') return s;
    if (Array.isArray(s)) return String(s[0] == null ? '' : s[0]);
    return String(s.name == null ? '' : s.name);
  }
  function linesForStation(name) {
    var ids = [];

      var sts = l.stations || [];

    });

  }

  /* ---------- 工具 ---------- */
  var cur = null, chEls = [], nodeEls = [], io = null;

  function yearText(y) { return y < 0 ? '公元前 ' + Math.abs(y) : String(y); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
    });
  }
  function imgSrc(slug, n) { return 'assets/img/spots/' + slug + '-' + n + '.jpg'; }

  /* ---------- 渲染 ---------- */
  function render(sp) {
    var s = (typeof STORY !== 'undefined') ? STORY[sp.name] : null;
    if (!s) { renderMissing(sp); return false; }
    crumb.textContent = sp.name;
    if (titleEl) titleEl.textContent = sp.name;
    if (subEl) subEl.textContent = (sp.intro || '');

    var c = (typeof CATEGORY !== 'undefined' && CATEGORY[sp.cat]) || { color: '#A69F92', label: sp.cat };
    var stName = sp.station;

    var lids = linesForStation(stName);
    var openYear = 0;
    if (lids.length) {
      var ys = lids.map(function (id) { return (lineById[id] || {}).year || 9999; });
      openYear = Math.min.apply(null, ys);
    }
    var opened = openYear > 0 && openYear <= 2025;

    /* 章节 HTML —— 三张配图各只出现一次 */
    var used = {}, html = '';
    s.chapters.forEach(function (ch, i) {
      var k = KIND[ch.kind] || KIND.spot;
      var fig = '';
      if (ch.img && !used[ch.img]) {
        used[ch.img] = 1;
        fig = '<figure class="st-fig">' +
          '<img src="' + imgSrc(s.slug, ch.img) + '" alt="' + esc(sp.name + ' · ' + (CAPT[ch.img] || '')) + '" loading="lazy">' +
          '<figcaption>' + esc(sp.name) + ' · ' + (CAPT[ch.img] || '') + '</figcaption>' +
          '</figure>';
      }
      html += '<section class="st-ch" data-kind="' + ch.kind + '" data-i="' + i + '">' +
        '<div class="ch-top">' +
          '<span class="ch-y">' + yearText(ch.y) + '</span>' +
          '<h3 class="ch-t">' + esc(ch.t) + '</h3>' +
          '<span class="ch-tag">' + k.tag + '</span>' +
        '</div>' +
        '<p class="ch-x">' + esc(ch.x) + '</p>' +
        fig +
      '</section>';
    });

    /* 交通人文关联 */
    var traf = null;
    s.chapters.forEach(function (ch) { if (ch.kind === 'rail' || ch.kind === 'road') traf = ch; });
    var b = s.bond || {};
    var walk = sp.walk || b.walk || '';
    var stLabel = b.st || (stName + '站');
    var mins = (walk.match(/(\d+)\s*分钟/) || [])[1];
    var walkNear = /\d\s*分钟/.test(walk) ? walk.replace(/^出站\s*/, '') : walk;
    var bondX =
      '「' + esc(traf ? traf.t : '抵达') + '」——这句话背后，是 ' + esc(b.line || '') + ' ' +
      (b.year ? b.year + ' 年通车之后的变化。' : '带来的变化。') +
      '从' + esc(stLabel) + '出来，' + esc(walkNear) + '，就到了' + esc(sp.name) + '。' +
      '在此之前，来这里多半要专门安排：查线路、换乘、找车位；在此之后，它成了可以随时拐进来的一段路。' +
      '交通改变的从来不只是时间。它决定了谁能抵达——老人能不能独自出门，孩子能不能自己来，' +
      '外地游客是匆匆打卡，还是愿意在门口站一会儿。' +
      esc(sp.name) + '与' + esc(stLabel) + '之间' +
      (mins ? '这 ' + mins + ' 分钟的路' : '这一段路') +
      '，是这座城市写在地上的一句话：风景，不应该只属于有时间的人。';

    html += '<div class="st-bond">' +
      '<div class="bd-kicker">人 文 关 联 · 景 点 与 交 通</div>' +
      '<h3>' + esc(sp.name) + ' × ' + esc(b.st || stName + '站') + '</h3>' +
      '<p class="bd-x">' + bondX + '</p>' +
      '<div class="bd-grid">' +
        '<div class="bd-cell"><span>最近车站</span><b>' + esc(b.st || stName + '站') + '</b><em>' + esc(walk) + '</em></div>' +
        '<div class="bd-cell"><span>经由线路</span><b>' + esc(b.line || '—') + '</b><em>' + (b.year ? b.year + ' 年通车' : '') + '</em></div>' +
        '<div class="bd-cell"><span>当前状态</span><b>' + (opened ? '已开通' : (openYear ? openYear + ' 年开通' : '—')) + '</b><em>' + esc((c && c.label) || sp.cat) + '</em></div>' +
      '</div>' +
      '<div class="bd-foot">' +
        '<button class="bd-btn" data-sact="back">回到线路图看它</button>' +
        '<button class="bd-btn ghost" data-sact="top">回到故事开头</button>' +
      '</div>' +
    '</div>';

    html += '<div class="st-end">苏 州 · ' + esc(sp.name) + '<span class="dot">·</span>人 文 故 事<span class="dot">·</span>完</div>';

    /* 扉页 */
    var hero = '<header class="st-hero">' +
      '<div class="st-kicker">S U Z H O U · 人 文 故 事</div>' +
      '<h2>' + esc(sp.name) + '</h2>' +
      '<div class="st-cat"><i></i>' + esc((c && c.label) || sp.cat) + '　·　' + esc(sp.intro || '') + '</div>' +
      '<p class="st-lead">' + esc(s.lead) + '</p>' +
      (s.quote ? '<p class="st-quote">' + esc(s.quote) + '</p>' : '') +
      '<div class="st-meta">' +
        '<span class="st-chip seal">人文故事 · <b>' + s.chapters.length + '</b> 个瞬间</span>' +
        '<span class="st-chip">最近车站 · <b>' + esc(b.st || stName + '站') + '</b></span>' +
        '<span class="st-chip">经由 · <b>' + esc(b.line || '—') + '</b></span>' +
        '<span class="st-chip">到达 · <b>' + esc(walk) + '</b></span>' +
      '</div>' +
      '<div class="st-scrollhint"><span class="ln"></span>向下滚动，看它一路走到今天</div>' +
    '</header>';

    doc.innerHTML = hero + html;

    /* 配图缺失时给占位（图片稍后补） */
    Array.prototype.forEach.call(doc.querySelectorAll('.st-fig img'), function (im) {
      var swap = function () {
        var f = im.closest('.st-fig');
        if (!f) return;
        var d = document.createElement('div');
        d.className = 'noimg';
        d.textContent = '画 面 待 补';
        im.replaceWith(d);
      };
      im.addEventListener('error', swap, { once: true });
      if (im.complete && im.naturalWidth === 0) swap();
    });

    chEls = Array.prototype.slice.call(doc.querySelectorAll('.st-ch'));
    buildRail(s);
    return true;
  }

  function renderMissing(sp) {
    doc.innerHTML = '<header class="st-hero"><div class="st-kicker">S U Z H O U · 人 文 故 事</div>' +
      '<h2>暂未收录</h2>' +
      '<p class="st-lead">没有找到「' + esc(sp ? sp.name : '该景点') + '」的故事数据。' +
      '请返回线路图，点击带有「人文故事」按钮的景点图标。</p>' +
      '<div class="st-meta"><button class="bd-btn" data-sact="back">回到线路图</button></div></header>';
    chEls = []; nodeEls = []; nodesBox.innerHTML = '';
    track.style.height = '0px';
  }

  function buildRail(s) {
    var h = '';
    s.chapters.forEach(function (ch, i) {
      var k = KIND[ch.kind] || KIND.spot;
      h += '<button class="st-node" data-kind="' + ch.kind + '" data-i="' + i + '">' +
        '<span class="nd"></span>' +
        '<span class="ny">' + yearText(ch.y) + '</span>' +
        '<span class="nt">' + esc(ch.t) + '</span>' +
        (k.rail ? '<span class="nk">' + k.rail + '</span>' : '') +
      '</button>';
    });
    nodesBox.innerHTML = h;
    nodeEls = Array.prototype.slice.call(nodesBox.querySelectorAll('.st-node'));
    nodeEls.forEach(function (n) {
      n.addEventListener('click', function () {
        var i = +n.getAttribute('data-i');
        if (chEls[i]) chEls[i].scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    });
  }

  /* ---------- 滚动联动 ---------- */
  var raf = 0;
  function onScroll() { if (raf) return; raf = requestAnimationFrame(tick); }

  function tick() {
    raf = 0;
    if (!cur) return;
    var max = scroller.scrollHeight - scroller.clientHeight;
    var p = max > 0 ? Math.min(1, Math.max(0, scroller.scrollTop / max)) : 0;

    /* 五幕交叉淡入：越来越现代 */
    var pos = p * (scenes.length - 1);
    var off = -p * 300;
    bg.style.setProperty('--off', off.toFixed(1));
    scenes.forEach(function (d, i) {
      var o = 1 - Math.abs(pos - i);
      d.style.opacity = (o < 0 ? 0 : o).toFixed(3);
    });

    /* 天空与光晕：旧 → 新 */
    var t = p * p * (3 - 2 * p);
    skyMod.style.opacity = t.toFixed(3);
    glow.style.opacity = Math.pow(p, 1.4).toFixed(3);

    /* 时间条：当前章节 */
    var idx = 0, mid = scroller.scrollTop + scroller.clientHeight * 0.42;
    chEls.forEach(function (el, i) { if (el.offsetTop <= mid) idx = i + 1; });
    nodeEls.forEach(function (n, i) { n.classList.toggle('on', i === idx - 1); });

    if (idx > 0 && nodeEls[idx - 1]) {
      var nd = nodeEls[idx - 1];
      track.style.height = (nd.offsetTop + nd.offsetHeight / 2) + 'px';
    } else {
      track.style.height = '0px';
    }
  }

  function watchChapters() {
    if (io) io.disconnect();
    io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) e.target.classList.add('in'); });
    }, { root: scroller, rootMargin: '0px 0px -8% 0px', threshold: 0.12 });
    chEls.forEach(function (el) { io.observe(el); });
  }

  /* ---------- 返回线路图 ---------- */
  function goBack() {
    try {
      if (window.history.length > 1 && document.referrer && document.referrer.indexOf(location.host) >= 0) {
        window.history.back();
      } else {
        window.location.href = 'index.html';
      }
    } catch (e) {
      window.location.href = 'index.html';
    }
  }

  /* ---------- 启动 ---------- */
  function init() {
    if (!sec) return;
    var param = new URLSearchParams(window.location.search).get('spot');
    var sp = null;
    if (param && typeof SPOTS !== 'undefined') {
      sp = SPOTS.find(function (x) { return x.name === param; }) || null;
    }
    if (!sp && typeof SPOTS !== 'undefined' && SPOTS.length) sp = SPOTS[0];
    cur = sp;
    render(sp);
    scroller.scrollTop = 0;
    requestAnimationFrame(function () {
      tick();
      watchChapters();
      chEls.slice(0, 2).forEach(function (el, i) {
        setTimeout(function () { el.classList.add('in'); }, 160 + i * 140);
      });
    });

    $('stBack').addEventListener('click', goBack);
    sec.addEventListener('contextmenu', function (e) { e.preventDefault(); goBack(); });
    scroller.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    doc.addEventListener('click', function (e) {
      var b = e.target.closest('[data-sact]');
      if (!b) return;
      var a = b.getAttribute('data-sact');
      if (a === 'back') goBack();
      else if (a === 'top') scroller.scrollTo({ top: 0, behavior: 'smooth' });
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { e.preventDefault(); goBack(); }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
})();

</script>
</body>
</html>
